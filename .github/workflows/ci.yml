# Checks every pull request and every push to main: types, lint, unit tests,
# migrations and integration tests on a fresh PostGIS database, unused code,
# the production build and HTTP end-to-end tests against it. See docs/CONTRIBUIR.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Same image as production (docs/INFRAESTRUCTURA.md).
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: valuaxis_ci
          POSTGRES_USER: valuaxis
          POSTGRES_PASSWORD: valuaxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valuaxis -d valuaxis_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://valuaxis:valuaxis@localhost:5432/valuaxis_ci?schema=public
      # As in .env.example: email links are built from APP_URL, and emails are only logged.
      APP_URL: http://localhost:3000
      EMAIL_PROVIDER: development
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      # Version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Migrations on a fresh database
        run: pnpm exec prisma migrate deploy

      - name: Integration tests
        run: pnpm test:integration

      - name: Unused code
        run: pnpm dlx knip@6

      - name: Build
        run: pnpm build

      # HTTP tests against the built app: the authorization matrix per role,
      # tenant isolation and the main valuation flow (tests/e2e).
      - name: End-to-end tests
        env:
          # A production server refuses a localhost APP_URL, so the app gets a
          # public-looking one. The tests send it as the Origin of their requests.
          APP_URL: https://valuaxis.e2e.test
          PORT: "3000"
          E2E_BASE_URL: http://127.0.0.1:3000
        run: |
          pnpm start > next-e2e.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -s -o /dev/null "$E2E_BASE_URL/api/auth/session"; then break; fi
            if ! kill -0 $server 2>/dev/null; then cat next-e2e.log; exit 1; fi
            sleep 1
          done
          curl -s -o /dev/null "$E2E_BASE_URL/api/auth/session" || { echo "The app did not start"; cat next-e2e.log; exit 1; }
          pnpm test:e2e || { echo "--- server log ---"; cat next-e2e.log; exit 1; }
